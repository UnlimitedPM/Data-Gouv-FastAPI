name: datafrance-explorer

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DFE_DATABASE_URL: sqlite+aiosqlite:////data/datafrance.db
      DFE_CORS_ORIGINS: "*"
    volumes:
      - datafrance-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  datafrance-data:
